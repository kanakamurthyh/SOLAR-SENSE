[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsense"
version = "2.0.0"
description = "Physics-first, real-plant-calibrated solar feasibility and probabilistic forecasting for India"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kanakamurthy H" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "pvlib>=0.13",
    "xgboost>=3.0",
    "requests>=2.31",
    "pyarrow>=15",
    "plotly>=6.0",
    "streamlit>=1.45",
]

[project.optional-dependencies]
agent = ["anthropic>=1.11"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["solarsense*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access (deselect with -m 'not network')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", ".backup"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
